<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST TRACK — Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-base);
            overflow: hidden;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border-subtle) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        /* Radial glow behind form */
        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,255,136,0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 1rem;
        }

        /* Brand / Logo area */
        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-md);
            background: var(--bg-panel);
            margin-bottom: 1rem;
            box-shadow: 0 0 20px rgba(0,255,136,0.1);
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
            color: var(--accent-green);
        }

        .brand h1 {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: var(--accent-green);
            text-transform: uppercase;
        }

        .brand p {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            letter-spacing: 0.05em;
        }

        /* Login Card */
        .login-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-normal);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: 0 4px 32px rgba(0,0,0,0.4);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .card-header .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-red   { background: #ff5f57; }
        .dot-amber { background: #febc2e; }
        .dot-green { background: var(--accent-green); }

        .card-header span {
            margin-left: auto;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Form */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.4rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .input-icon svg {
            width: 15px;
            height: 15px;
        }

        .form-input {
            width: 100%;
            padding: 0.65rem 0.75rem 0.65rem 2.5rem;
            background: var(--bg-input);
            border: 1px solid var(--border-normal);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.875rem;
            outline: none;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(0,255,136,0.1);
        }

        /* Error message */
        .error-msg {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 0.75rem;
            background: rgba(255,68,68,0.1);
            border: 1px solid rgba(255,68,68,0.3);
            border-radius: var(--radius-md);
            color: var(--accent-red);
            font-size: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .error-msg.visible {
            display: flex;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-mono);
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            background: #00e07a;
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer text */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        /* Scanning animation bar */
        .scan-bar {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
            border-radius: 1px;
            margin-bottom: 1.5rem;
            animation: scan 2s ease-in-out infinite;
        }

        @keyframes scan {
            0%   { opacity: 0.3; transform: scaleX(0.3); }
            50%  { opacity: 1;   transform: scaleX(1); }
            100% { opacity: 0.3; transform: scaleX(0.3); }
        }

        @media (prefers-reduced-motion: reduce) {
            .scan-bar { animation: none; opacity: 1; }
        }

        /* Focus visible */
        .form-input:focus-visible {
            outline: 2px solid var(--accent-green);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <div class="login-wrapper" role="main">
        <!-- Brand -->
        <div class="brand" aria-label="Ghost Track">
            <div class="brand-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                </svg>
            </div>
            <h1>Ghost Track</h1>
            <p>Live Location Intelligence System</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <!-- Fake terminal titlebar -->
            <div class="card-header" aria-hidden="true">
                <span class="dot dot-red"></span>
                <span class="dot dot-amber"></span>
                <span class="dot dot-green"></span>
                <span>AUTH_PORTAL v2.4</span>
            </div>

            <div class="scan-bar" aria-hidden="true"></div>

            <!-- Error placeholder (shown via JS if redirected after failed login) -->
            <div class="error-msg" id="errorMsg" role="alert" aria-live="polite">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="15" height="15" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
                Invalid credentials. Access denied.
            </div>

            <form action="/login" method="post" id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="username">// Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                            </svg>
                        </span>
                        <input
                            type="text"
                            class="form-input"
                            id="username"
                            name="username"
                            placeholder="operator_id"
                            required
                            autocomplete="username"
                            aria-label="Username"
                            spellcheck="false"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">// Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                            </svg>
                        </span>
                        <input
                            type="password"
                            class="form-input"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                            aria-label="Password"
                        >
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    Authenticate
                </button>
            </form>
        </div>

        <div class="login-footer" aria-hidden="true">
            [ AUTHORIZED PERSONNEL ONLY ] — GHOST TRACK OPS
        </div>
    </div>

    <script>
        // Show error if redirected after failed login (cookie not set)
        // We detect a failed auth by checking: came from /login POST but no auth cookie
        const params = new URLSearchParams(location.search);
        if (params.get('err') === '1') {
            document.getElementById('errorMsg').classList.add('visible');
        }

        // Disable submit on form send to prevent double-submit
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                e.preventDefault();
                document.getElementById('errorMsg').classList.add('visible');
                document.getElementById('errorMsg').textContent = 'All fields are required.';
                return;
            }
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').textContent = 'Authenticating...';
        });
    </script>
</body>

</html>
